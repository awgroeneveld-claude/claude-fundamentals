[project]
name = "claude-fundamentals"
version = "0.1.0"
description = "Structured fundamental-analysis calls to the Claude API with per-measure reliability"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["fundamentals_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
